[project]
name = "otfeatfreezer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "postnumbers", email = "post@postnumbers.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fonttools>=4.66.1",
    "opentype-feature-freezer>=1.32.2",
    "pyinstaller>=6.22.3",
    "pyside6>=6.12.0",
]

[project.scripts]
otfeatfreezer = "otfeatfreezer:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dmgbuild>=1.6.7",
    "pyinstaller>=6.22.3",
]
